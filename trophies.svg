    <text x="62" y="93" style="font:400 10px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8">Contributions</text>
    <text x="62" y="107" style="font:700 9px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c4b5fd;letter-spacing:.08em">DIAMOND</text>
