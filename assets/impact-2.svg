<svg xmlns="http://www.w3.org/2000/svg" width="400" height="118" viewBox="0 0 400 118" role="img" aria-label="500+ faculty users, 1–2 ms API response time">
<style>
  .f{animation:fi .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="f" style="animation-delay:0.10s">
    <rect x="0.5" y=".5" width="191" height="117" rx="12" fill="#0f1724" stroke="#1e293b"/>
    <rect x="16" y="0" width="0" height="3" rx="1.5" fill="#a78bfa"><animate attributeName="width" from="0" to="160" dur="1.1s" begin="0.30s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
    <text x="18" y="54" style="font:800 32px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a78bfa;letter-spacing:-.5px">500+</text>
    <text x="18" y="80" style="font:600 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0">faculty users</text>
    <text x="18" y="99" style="font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b">admin &amp; appraisal portals</text>
  </g><g class="f" style="animation-delay:0.25s">
    <rect x="208.5" y=".5" width="191" height="117" rx="12" fill="#0f1724" stroke="#1e293b"/>
    <rect x="224" y="0" width="0" height="3" rx="1.5" fill="#f59e0b"><animate attributeName="width" from="0" to="160" dur="1.1s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
    <text x="226" y="54" style="font:800 32px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f59e0b;letter-spacing:-.5px">1–2 ms</text>
    <text x="226" y="80" style="font:600 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0">API response time</text>
    <text x="226" y="99" style="font:400 11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b">faculty admin portal</text>
  </g>
</svg>
