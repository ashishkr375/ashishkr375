<svg xmlns="http://www.w3.org/2000/svg" width="400" height="110" viewBox="0 0 400 110" role="img" aria-label="Thanks for visiting">
<style>
  .f{animation:fi .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".35"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".55"/></linearGradient>
<clipPath id="c"><rect width="400" height="110" rx="14"/></clipPath></defs>
<g clip-path="url(#c)">
  <path d="M0 58 q52.5 -10 105 0 t105 0 q52.5 -10 105 0 t105 0 q52.5 -10 105 0 t105 0 q52.5 -10 105 0 t105 0 V110 H0 Z" fill="url(#w1)"><animateTransform attributeName="transform" type="translate" values="0 0;-420 0" dur="9s" repeatCount="indefinite"/></path>
  <path d="M0 72 q70 -8 140 0 t140 0 q70 -8 140 0 t140 0 q70 -8 140 0 t140 0 V110 H0 Z" fill="url(#w2)"><animateTransform attributeName="transform" type="translate" values="-560 0;0 0" dur="12s" repeatCount="indefinite"/></path>
  <rect y="84" width="400" height="110" fill="#0b1324"/>
</g>
<text class="f" x="200" y="30" text-anchor="middle" style="font:500 12px 'JetBrains Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#64748b">$ exit <tspan fill="#38bdf8">0</tspan>  —  thanks for stopping by</text>
</svg>
