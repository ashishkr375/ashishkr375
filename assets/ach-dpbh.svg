    <path d="M6 0h8l-4 12zM16 0h8l-4 12z" fill="#a78bfa" opacity=".55"/>
    <circle cx="15" cy="22" r="11" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa" stroke-width="1.6"/>
